name: V2 支付宝扫码抓包

on:
  push:
    branches: [main]
    paths:
      - 'v2/qr_login.py'
      - 'v2/recorder.py'
      - '.github/workflows/v2-qr-capture.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: xddq-v2-qr-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright opencv-python-headless numpy
          playwright install --with-deps chromium

      - name: 恢复 #13 pcweb 登录态
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/xddq-auth
          mkdir -p /tmp/xddq-auth
          gh run download 35500415126 -n xddq-live-capture-13 -D /tmp/xddq-auth
          test -f /tmp/xddq-auth/qr/storage_state.json
          echo "GAME_AUTH_FILE=/tmp/xddq-auth/qr/storage_state.json" >> "$GITHUB_ENV"

      - name: 启动扫码会话
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
          GAME_COOKIES_JSON: ${{ secrets.GAME_COOKIES_JSON }}
          GAME_AUTH_JSON: ${{ secrets.GAME_AUTH_JSON }}
          QR_SCAN_TIMEOUT: '180'
          PYTHONUNBUFFERED: '1'
        run: |
          rm -rf v2/qr
          mkdir -p v2/qr
          nohup env RUNNER_TRACKING_ID= python v2/qr_login.py > v2/qr/session.log 2>&1 &
          echo $! > v2/qr/session.pid

          for i in $(seq 1 120); do
            if [ -f v2/qr/READY ]; then
              echo "二维码已生成"
              exit 0
            fi
            if [ -f v2/qr/DONE ]; then
              echo "当前登录态已可直接使用"
              exit 0
            fi
            if [ -f v2/qr/FAILED ]; then
              cat v2/qr/session.log || true
              cat v2/qr/FAILED || true
              exit 1
            fi
            if ! kill -0 "$(cat v2/qr/session.pid)" 2>/dev/null; then
              cat v2/qr/session.log || true
              echo "扫码进程提前退出且没有结果标记"
              exit 1
            fi
            sleep 1
          done

          cat v2/qr/session.log || true
          echo "等待二维码生成超时"
          exit 1

      - name: 上传登录二维码
        if: ${{ hashFiles('v2/qr/qr.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: xddq-login-qr-${{ github.run_number }}
          path: |
            v2/qr/qr.png
            v2/qr/login_page.png
            v2/qr/status.json
          if-no-files-found: error
          retention-days: 1

      - name: 等待扫码并完成抓包
        run: |
          pid="$(cat v2/qr/session.pid)"
          for i in $(seq 1 190); do
            if [ -f v2/qr/DONE ]; then
              cat v2/qr/session.log || true
              exit 0
            fi
            if [ -f v2/qr/FAILED ]; then
              cat v2/qr/session.log || true
              cat v2/qr/FAILED || true
              exit 1
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat v2/qr/session.log || true
              echo "扫码进程已退出但没有 DONE/FAILED 标记"
              exit 1
            fi
            sleep 5
          done

          kill "$pid" 2>/dev/null || true
          cat v2/qr/session.log || true
          echo "扫码抓包进程总超时"
          exit 1

      - name: 上传协议抓包结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xddq-live-capture-${{ github.run_number }}
          path: |
            v2/qr/
            v2/capture/
          if-no-files-found: warn
          retention-days: 1
