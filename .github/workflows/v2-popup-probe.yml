name: V2 Popup Probe

on:
  push:
    branches: [main]
    paths:
      - 'v2/probe_popup.py'
      - 'v2/templates/**'
      - '.github/workflows/v2-popup-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install playwright opencv-python-headless numpy opencv-python-headless
          playwright install --with-deps chromium
      - name: Restore latest accepted game state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/xddq27
          mkdir -p /tmp/xddq27
          gh run download 35559671483 -n xddq-auth-state-27 -D /tmp/xddq27
          test -f /tmp/xddq27/storage_state.json
      - run: python v2/probe_popup.py
      - name: Preserve auth state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xddq-auth-state-${{ github.run_number }}
          path: v2/popup-probe/storage_state.json
          retention-days: 30
      - name: Upload non-sensitive probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xddq-popup-probe-${{ github.run_number }}
          path: |
            v2/popup-probe/*.png
            v2/popup-probe/vision_events.json
          retention-days: 1
