name: V2 Popup Probe

on:
  push:
    branches: [main]
    paths:
      - 'v2/probe_popup.py'
      - 'v2/templates/**'
      - '.github/workflows/v2-popup-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install playwright opencv-python-headless numpy opencv-python-headless
          playwright install --with-deps chromium
      - name: Restore latest accepted game state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/xddq25
          mkdir -p /tmp/xddq25
          gh run download 35557024975 -n xddq-popup-probe-25 -D /tmp/xddq25
          test -f /tmp/xddq25/storage_state.json
      - run: python v2/probe_popup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xddq-popup-probe-${{ github.run_number }}
          path: v2/popup-probe/
          retention-days: 1
