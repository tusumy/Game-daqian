name: 自动打理大千药田 V2

on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'v2/probe_popup.py'
      - 'v2/patch_grid_harvest.py'
      - 'v2/patch_panel_fix.py'
      - 'v2/templates/**'
      - '.github/workflows/v2-popup-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v2-popup-probe-main
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[run-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install playwright opencv-python-headless numpy opencv-python-headless
          playwright install --with-deps chromium
      - name: Restore latest accepted game state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/xddq29
          mkdir -p /tmp/xddq29

          PREV_RUN="$(gh run list --workflow v2-popup-probe.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -n "$PREV_RUN" ]; then
            echo "Restoring auth state from previous successful probe run $PREV_RUN"
            gh run download "$PREV_RUN" -p 'xddq-auth-state-*' -D /tmp/xddq29
          else
            echo "No previous successful probe run found; using bootstrap state"
            gh run download 35562579777 -n xddq-auth-state-29 -D /tmp/xddq29
          fi

          STATE_FILE="$(find /tmp/xddq29 -name storage_state.json -print -quit)"
          test -n "$STATE_FILE"
          if [ "$STATE_FILE" != "/tmp/xddq29/storage_state.json" ]; then
            cp "$STATE_FILE" /tmp/xddq29/storage_state.json
          fi
          test -f /tmp/xddq29/storage_state.json
      - name: Apply V2 runtime patches
        run: |
          python v2/patch_grid_harvest.py
          python v2/patch_panel_fix.py
      - run: python v2/probe_popup.py
      - name: Preserve auth state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xddq-auth-state-${{ github.run_number }}
          path: v2/popup-probe/storage_state.json
          retention-days: 30
      - name: Upload non-sensitive probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xddq-popup-probe-${{ github.run_number }}
          path: |
            v2/popup-probe/*.png
            v2/popup-probe/vision_events.json
          retention-days: 1
