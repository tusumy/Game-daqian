name: 自动打理大千药田

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: 检查代码
        uses: actions/checkout@v4

      - name: 等待 V2 Probe 释放游戏会话
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            ACTIVE="$(gh run list --branch main --limit 30 --json name,status --jq '[.[] | select(.name == "V2 Popup Probe" and (.status == "in_progress" or .status == "queued"))] | length')"
            if [ "$ACTIVE" = "0" ]; then
              echo "没有活动中的 V2 Popup Probe，继续正式药田任务"
              exit 0
            fi
            echo "仍有 $ACTIVE 个 V2 Popup Probe 占用游戏，会话保护中"
            sleep 30
          done
          echo "等待 Probe 释放超时"
          exit 1

      - name: 恢复上一轮成功登录态
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/farm-auth
          mkdir -p /tmp/farm-auth

          for RUN_ID in $(gh run list --workflow run.yml --branch main --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
            rm -rf /tmp/farm-auth/*
            if gh run download "$RUN_ID" -p 'farm-auth-state-*' -D /tmp/farm-auth >/dev/null 2>&1; then
              STATE_FILE="$(find /tmp/farm-auth -name farm_storage_state.json -print -quit)"
              if [ -n "$STATE_FILE" ]; then
                echo "GAME_AUTH_FILE=$STATE_FILE" >> "$GITHUB_ENV"
                echo "已恢复登录态：run $RUN_ID"
                break
              fi
            fi
          done

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Chromium 与图像匹配依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright opencv-python-headless numpy pillow
          playwright install --with-deps chromium

      - name: 执行修仙种菜
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
          GAME_AUTH_JSON: ${{ secrets.GAME_AUTH_JSON }}
          HEADLESS: '1'
          VIEWPORT_WIDTH: '800'
          VIEWPORT_HEIGHT: '900'
          PYTHONUNBUFFERED: '1'
        run: python cron_farm.py

      - name: 保存本轮登录态
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farm-auth-state-${{ github.run_number }}
          path: farm_storage_state.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farm-debug-${{ github.run_number }}
          path: |
            final_scene.png
            error_scene.png
          if-no-files-found: ignore
          retention-days: 7
