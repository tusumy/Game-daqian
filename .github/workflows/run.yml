name: 自动打理大千药田

on:
  schedule:
    # 国际标准时间。'0 */2 * * *' 代表每 2 小时自动跑一次
    - cron: '0 */2 * * *'
  workflow_dispatch: # 允许手动在网页上点按钮测试

jobs:
  farm:
    runs-on: ubuntu-latest
    # 核心排雷：强制让系统适配最新的 Node 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      
    steps:
    - name: 检查代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装浏览器与视觉AI依赖
      run: |
        pip install playwright opencv-python-headless numpy pillow
        playwright install chromium

    - name: 执行修仙种菜
      env:
        GAME_URL: ${{ secrets.GAME_URL }}
      run: python cron_farm.py