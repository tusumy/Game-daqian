name: V2 协议侦察

on:
  push:
    branches: [main]
    paths:
      - 'auth.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xddq-v2-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright opencv-python-headless numpy
          playwright install --with-deps chromium

      - name: 抓当前游戏协议
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
          GAME_COOKIES_JSON: ${{ secrets.GAME_COOKIES_JSON }}
          GAME_AUTH_JSON: ${{ secrets.GAME_AUTH_JSON }}
          PYTHONUNBUFFERED: '1'
        run: python v2/recorder.py

      - name: 上传抓包结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-protocol-capture-${{ github.run_number }}
          path: v2/capture/
          if-no-files-found: warn
          retention-days: 3
