name: V2 Game UI Probe

on:
  push:
    branches: [main]
    paths:
      - 'v2/probe_game_ui.py'
      - '.github/workflows/v2-ui-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Restore #20 login state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/xddq20
          mkdir -p /tmp/xddq20
          gh run download 35503150607 -n xddq-live-capture-20 -D /tmp/xddq20
          test -f /tmp/xddq20/qr/storage_state.json
      - name: Probe game popup
        run: python v2/probe_game_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: xddq-ui-probe-${{ github.run_number }}
          path: v2/ui-probe/
          retention-days: 1
